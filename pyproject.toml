[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wheeler-memory"
version = "0.3.6"
description = "Cellular automata-based associative memory system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
train = ["scikit-learn>=1.0"]

[project.scripts]
wheeler-store = "scripts.wheeler_store:main"
wheeler-recall = "scripts.wheeler_recall:main"
wheeler-temps = "scripts.wheeler_temps:main"
wheeler-forget = "scripts.wheeler_forget:main"
wheeler-sleep = "scripts.wheeler_sleep:main"
wheeler-agent = "scripts.wheeler_agent:main"
wheeler-info = "scripts.system_info:main"
wheeler-bench-gpu = "scripts.bench_gpu:main"
wheeler-scrub = "scripts.scrub_brick:main"
wheeler-crystallize = "scripts.wheeler_crystallize:main"
wheeler-primary = "scripts.wheeler_primary:main"
wheeler-bench = "scripts.bench_quality:main"
wheeler-generate = "scripts.wheeler_generate:main"
wheeler-mmlu = "scripts.wheeler_mmlu:main"
wheeler-scm = "scripts.wheeler_scm:main"
wheeler-simlex = "scripts.wheeler_simlex:main"

[project.urls]
Homepage = "https://github.com/fantomx42/wheeler-memory"
Repository = "https://github.com/fantomx42/wheeler-memory"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "embed: marks tests requiring sentence-transformers (deselect with '-m \"not embed\"')",
    "gpu: marks tests requiring GPU/HIP runtime (deselect with '-m \"not gpu\"')",
]

[tool.setuptools.packages.find]
include = ["wheeler_memory*", "scripts*"]
